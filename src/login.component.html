<div class="min-h-screen flex items-center justify-center bg-gray-100 dark:bg-gray-900">
  <div class="bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-xl w-96">
    <h2 class="text-2xl font-bold mb-6 text-center text-gray-800 dark:text-white">เข้าสู่ระบบ</h2>
    
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">ชื่อผู้ใช้งาน</label>
        <input [(ngModel)]="username" type="text" 
               class="mt-1 w-full p-3 border rounded-xl dark:bg-gray-700 dark:border-gray-600 dark:text-white">
      </div>
      
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">รหัสผ่าน</label>
        <input [(ngModel)]="password" type="password" 
               class="mt-1 w-full p-3 border rounded-xl dark:bg-gray-700 dark:border-gray-600 dark:text-white">
      </div>

      <button (click)="onLogin()" 
              class="w-full py-3 mt-4 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-medium transition">
        Login
      </button>
    </div>
  </div>
</div>
